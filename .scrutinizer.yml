checks:
  javascript: true

build:
  nodes:
    analysis:
      environment:
        node: v20
      project_setup:
        override: true
      tests:
        override:
          - js-scrutinizer-run
          - command: npm run test:coverage
            coverage:
              file: coverage/clover.xml
              format: clover
          - eslint-run .

filter:
  excluded_paths:
    - "android/*"
    - "dist/*"
    - "dist-web-check/*"
    - "node_modules/*"
