name: Web Export Deploy
description: Configure env, expo export web, optional FTP deploy (SamKirkland — sem locaweb)

inputs:
  app_type:
    required: true
  api_entrypoint:
    required: true
  socket:
    required: true
  domain:
    required: false
    default: ""
  remote_dir:
    description: "FTP server-dir relative to login home. Canonical document root is public_html/ (no tilde). Tilde paths (~/public_html/) land outside the vhost and must not be used."
    required: false
    default: "public_html/"
  skip_ftp:
    description: "If true, only export web (caller runs deploy)"
    required: false
    default: "false"
  ftp_protocol:
    description: "ftp | ftps | ftps-legacy (SamKirkland)"
    required: false
    default: "ftp"
  skip_verify:
    description: "If true, skip post-deploy HTTP verification against domain"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: "20"

    - name: Creating Config
      shell: bash
      run: |
        set -e
        ZOOM=$(node -p "require('./config/env.local.sample').env.ZOOM ?? 100")
        DOMAIN_LINE=""
        if [ -n "${{ inputs.domain }}" ]; then
          DOMAIN_LINE="DOMAIN: '${{ inputs.domain }}',"
        fi
        cat > ./config/env.local.js << ENVEOF
        const env = {
          API_ENTRYPOINT: '${{ inputs.api_entrypoint }}',
          SOCKET: '${{ inputs.socket }}',
          ${DOMAIN_LINE}
          APP_TYPE: '${{ inputs.app_type }}',
          ZOOM: ${ZOOM},
          NEW_RELIC: {
            LICENSE_KEY: process.env.NEW_RELIC_LICENSE_KEY || '',
            APPLICATION_ID: process.env.NEW_RELIC_APPLICATION_ID || '',
            ACCOUNT_ID: process.env.NEW_RELIC_ACCOUNT_ID || '',
            TRUST_KEY: process.env.NEW_RELIC_TRUST_KEY || '',
            BEACON: process.env.NEW_RELIC_BEACON || '',
            ERROR_BEACON: process.env.NEW_RELIC_ERROR_BEACON || ''
          }
        };
        module.exports = { env };
        ENVEOF

    - name: Update Submodules
      shell: bash
      run: |
        git submodule sync --recursive
        git submodule update --recursive --init --checkout

    - name: Install & build
      shell: bash
      run: |
        npm install --legacy-peer-deps
        npx expo install --fix
        npx expo export --platform web

    - name: Guard remote_dir (no tilde)
      if: ${{ inputs.skip_ftp != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        RD="${{ inputs.remote_dir }}"
        case "$RD" in
          "~"*|"~/"*)
            echo "::error::remote_dir must not use tilde (~). Use path relative to FTP login home, e.g. public_html/. Got: ${RD}"
            exit 1
            ;;
        esac
        if [[ "$RD" != */ ]]; then
          echo "::warning::remote_dir should end with /. SamKirkland expects trailing slash. Got: ${RD}"
        fi
        echo "remote_dir OK (relative, no tilde): ${RD}"

    # Sem locaweb/ftp-deploy. SamKirkland (basic-ftp).
    # Canonical document root for staging/dev/prod manager vhosts: public_html/
    # (relative to FTP account home). Do NOT use ~/public_html/ — tilde is
    # treated literally or resolves outside the vhost document root, so the
    # job can succeed while staging.controleonline.com keeps serving the old bundle.
    - name: Deploy FTP (SamKirkland)
      if: ${{ inputs.skip_ftp != 'true' }}
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      with:
        server: ${{ env.FTP_HOST }}
        username: ${{ env.FTP_USER }}
        password: ${{ env.FTP_PASS }}
        protocol: ${{ inputs.ftp_protocol }}
        security: loose
        local-dir: ./dist/
        server-dir: ${{ inputs.remote_dir }}
        state-name: .ftp-deploy-state.json
        log-level: standard
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**

    # Post-deploy HTTP smoke on the canonical domain.
    # SPA fallback returns 200 text/html for missing JS — must validate Content-Type + hash.
    - name: Post-deploy verify (domain HTTP)
      if: ${{ inputs.skip_ftp != 'true' && inputs.skip_verify != 'true' && inputs.domain != '' }}
      shell: bash
      run: |
        set -euo pipefail
        DOMAIN="${{ inputs.domain }}"
        DOMAIN="${DOMAIN%/}"
        echo "=== Post-deploy verify against ${DOMAIN} ==="

        if [ ! -f dist/index.html ]; then
          echo "::error::local dist/index.html missing after export"
          exit 1
        fi

        EXPECTED_JS=$(grep -oE '/_expo/static/js/web/index-[a-f0-9]+\.js' dist/index.html | head -1 || true)
        if [ -z "$EXPECTED_JS" ]; then
          echo "::error::could not extract expected index-*.js hash from local dist/index.html"
          exit 1
        fi
        EXPECTED_BASENAME=$(basename "$EXPECTED_JS")
        echo "Expected bundle from local export: ${EXPECTED_BASENAME}"

        PKG_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "unknown")
        APP_VERSION=$(node -p "require('./app.json').expo.version" 2>/dev/null || echo "unknown")
        VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode" 2>/dev/null || echo "unknown")
        ROOT_SHA=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
        echo "Deploy metadata: package=${PKG_VERSION} app.json=${APP_VERSION} versionCode=${VERSION_CODE} commit=${ROOT_SHA}"

        # Brief settle for CDN/proxy (Locaweb may lag a few seconds)
        sleep 3

        TMP_HTML=$(mktemp)
        HTTP_CODE=$(curl -sS -L --max-time 30 -o "$TMP_HTML" -w "%{http_code}" \
          -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
          "${DOMAIN}/index.html?_=$(date +%s)" || echo "000")
        CT=$(curl -sS -I -L --max-time 15 -H "Cache-Control: no-cache" \
          "${DOMAIN}/index.html?_=$(date +%s)" 2>/dev/null | tr -d '\r' | grep -i '^content-type:' | head -1 | cut -d' ' -f2- || true)

        echo "index.html HTTP ${HTTP_CODE}; Content-Type: ${CT:-unknown}"
        if [ "$HTTP_CODE" != "200" ]; then
          echo "::error::canonical domain index.html returned HTTP ${HTTP_CODE} (expected 200)"
          rm -f "$TMP_HTML"
          exit 1
        fi
        case "${CT}" in
          text/html*|application/xhtml*)
            ;;
          *)
            echo "::error::index.html Content-Type unexpected: ${CT:-empty} (expected text/html)"
            rm -f "$TMP_HTML"
            exit 1
            ;;
        esac

        REMOTE_JS=$(grep -oE '/_expo/static/js/web/index-[a-f0-9]+\.js' "$TMP_HTML" | head -1 || true)
        REMOTE_BASENAME=$(basename "${REMOTE_JS:-}")
        echo "Remote index.html references: ${REMOTE_BASENAME:-NONE}"
        rm -f "$TMP_HTML"

        if [ -z "$REMOTE_JS" ]; then
          echo "::error::remote index.html has no index-*.js script src"
          exit 1
        fi
        if [ "$REMOTE_BASENAME" != "$EXPECTED_BASENAME" ]; then
          echo "::error::bundle hash mismatch on ${DOMAIN}"
          echo "  local/export:  ${EXPECTED_BASENAME}"
          echo "  remote/served: ${REMOTE_BASENAME}"
          echo "FTP job may have uploaded to a different document root than the vhost (e.g. ~/public_html/ vs public_html/)."
          exit 1
        fi

        # Asset must be JS, not SPA HTML fallback
        ASSET_URL="${DOMAIN}${REMOTE_JS}"
        ASSET_TMP=$(mktemp)
        ASSET_CODE=$(curl -sS -L --max-time 30 -o "$ASSET_TMP" -w "%{http_code}" \
          -H "Cache-Control: no-cache" "$ASSET_URL" || echo "000")
        ASSET_CT=$(curl -sS -I -L --max-time 15 -H "Cache-Control: no-cache" \
          "$ASSET_URL" 2>/dev/null | tr -d '\r' | grep -i '^content-type:' | head -1 | cut -d' ' -f2- || true)
        echo "Asset ${REMOTE_BASENAME} HTTP ${ASSET_CODE}; Content-Type: ${ASSET_CT:-unknown}"

        if [ "$ASSET_CODE" != "200" ]; then
          echo "::error::bundle asset returned HTTP ${ASSET_CODE}"
          rm -f "$ASSET_TMP"
          exit 1
        fi
        case "${ASSET_CT}" in
          *javascript*|*ecmascript*|application/octet-stream*)
            ;;
          text/html*)
            echo "::error::bundle asset Content-Type is text/html (SPA fallback). File does not exist on the vhost document root."
            rm -f "$ASSET_TMP"
            exit 1
            ;;
          *)
            # Some hosts omit CT; sniff content
            if head -c 200 "$ASSET_TMP" | grep -qiE '<!DOCTYPE|<html'; then
              echo "::error::bundle asset body looks like HTML (SPA fallback), not JS"
              rm -f "$ASSET_TMP"
              exit 1
            fi
            ;;
        esac
        rm -f "$ASSET_TMP"

        echo "OK: ${DOMAIN} serves ${EXPECTED_BASENAME} (commit ${ROOT_SHA}, version ${APP_VERSION}/${VERSION_CODE})"
