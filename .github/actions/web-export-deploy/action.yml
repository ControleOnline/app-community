name: Web Export Deploy
description: Configure env, expo export web, optional FTP deploy (SamKirkland — sem locaweb)

inputs:
  app_type:
    required: true
  api_entrypoint:
    required: true
  socket:
    required: true
  domain:
    required: false
    default: ""
  remote_dir:
    description: "FTP server-dir relative to login home. Canonical document root is public_html/ (no tilde). Tilde paths (~/public_html/) land outside the vhost and must not be used."
    required: false
    default: "public_html/"
  skip_ftp:
    description: "If true, only export web (caller runs deploy)"
    required: false
    default: "false"
  ftp_protocol:
    description: "ftp | ftps | ftps-legacy (SamKirkland)"
    required: false
    default: "ftp"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: "20"

    - name: Creating Config
      shell: bash
      run: |
        set -e
        ZOOM=$(node -p "require('./config/env.local.sample').env.ZOOM ?? 100")
        DOMAIN_LINE=""
        if [ -n "${{ inputs.domain }}" ]; then
          DOMAIN_LINE="DOMAIN: '${{ inputs.domain }}',"
        fi
        cat > ./config/env.local.js << ENVEOF
        const env = {
          API_ENTRYPOINT: '${{ inputs.api_entrypoint }}',
          SOCKET: '${{ inputs.socket }}',
          ${DOMAIN_LINE}
          APP_TYPE: '${{ inputs.app_type }}',
          ZOOM: ${ZOOM},
          NEW_RELIC: {
            LICENSE_KEY: process.env.NEW_RELIC_LICENSE_KEY || '',
            APPLICATION_ID: process.env.NEW_RELIC_APPLICATION_ID || '',
            ACCOUNT_ID: process.env.NEW_RELIC_ACCOUNT_ID || '',
            TRUST_KEY: process.env.NEW_RELIC_TRUST_KEY || '',
            BEACON: process.env.NEW_RELIC_BEACON || '',
            ERROR_BEACON: process.env.NEW_RELIC_ERROR_BEACON || ''
          }
        };
        module.exports = { env };
        ENVEOF

    - name: Update Submodules
      shell: bash
      run: |
        git submodule sync --recursive
        git submodule update --recursive --init --checkout

    - name: Install & build
      shell: bash
      run: |
        npm install --legacy-peer-deps
        npx expo install --fix
        npx expo export --platform web

    - name: Guard remote_dir (no tilde)
      if: ${{ inputs.skip_ftp != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        RD="${{ inputs.remote_dir }}"
        case "$RD" in
          "~"*|"~/"*)
            echo "::error::remote_dir must not use tilde (~). Use path relative to FTP login home, e.g. public_html/. Got: ${RD}"
            exit 1
            ;;
        esac
        if [[ "$RD" != */ ]]; then
          echo "::warning::remote_dir should end with /. SamKirkland expects trailing slash. Got: ${RD}"
        fi
        echo "remote_dir OK (relative, no tilde): ${RD}"

    # Sem locaweb/ftp-deploy. SamKirkland (basic-ftp).
    # Canonical document root for staging/dev/prod manager vhosts: public_html/
    # (relative to FTP account home). Do NOT use ~/public_html/ — tilde is
    # treated literally or resolves outside the vhost document root, so the
    # job can succeed while staging.controleonline.com keeps serving the old bundle.
    - name: Deploy FTP (SamKirkland)
      if: ${{ inputs.skip_ftp != 'true' }}
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      with:
        server: ${{ env.FTP_HOST }}
        username: ${{ env.FTP_USER }}
        password: ${{ env.FTP_PASS }}
        protocol: ${{ inputs.ftp_protocol }}
        security: loose
        local-dir: ./dist/
        server-dir: ${{ inputs.remote_dir }}
        state-name: .ftp-deploy-state.json
        log-level: standard
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
