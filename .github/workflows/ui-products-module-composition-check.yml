name: UI Products Module Composition Check

on:
  pull_request:
    branches:
      - master
      - staging
    paths:
      - .gitmodules
      - modules/controleonline/ui-products
      - tools/verify-ui-products-module-pointer.cjs
      - .github/workflows/ui-products-module-composition-check.yml

jobs:
  verify-ui-products-pointer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify ui-products module pointer
        run: node tools/verify-ui-products-module-pointer.cjs
