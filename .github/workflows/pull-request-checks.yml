name: Pull Request Checks

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund

      - name: Check JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Check diff hygiene
        run: git diff --check

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: baseline-checks

    steps:
      - uses: actions/checkout@v5

      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --recursive --init --checkout

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --legacy-peer-deps --ignore-scripts --no-package-lock --no-audit --no-fund

      - name: Fix Expo Dependencies
        run: npx expo install --fix

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:browser
