# Controle Online — deploy pipeline (web + android + lg-webOS).
# Único pipeline Controle Online.
# 1) configure → ambiente
# 2) web (dev / staging / master)
# 3) android AAB+APK + lg-webOS (somente master — sem staging)
name: Deploy

on:
  push:
    branches: [dev, staging, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente"
        required: true
        type: choice
        options: [dev, staging, master]

concurrency:
  group: deploy-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  # ─── 1. Ambiente ───────────────────────────────────────────────────────────
  configure:
    name: "1 · Configure"
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set.outputs.env }}
      api: ${{ steps.set.outputs.api }}
      socket: ${{ steps.set.outputs.socket }}
      domain: ${{ steps.set.outputs.domain }}
      ftp_profile: ${{ steps.set.outputs.ftp_profile }}
      publish_native: ${{ steps.set.outputs.publish_native }}
      web_app_type: ${{ steps.set.outputs.web_app_type }}
    steps:
      - id: set
        run: |
          set -e
          ENV="${{ github.event.inputs.environment || github.ref_name }}"
          case "$ENV" in
            dev)
              API=https://d.controleonline.com
              SOCK=wss://d.controleonline.com
              DOMAIN=https://d.controleonline.com
              FTP=dev
              NATIVE=false
              ;;
            staging)
              API=https://s.controleonline.com
              SOCK=wss://s.controleonline.com
              DOMAIN=https://staging.controleonline.com
              FTP=staging
              NATIVE=false
              ;;
            master)
              API=https://api.controleonline.com
              SOCK=wss://api.controleonline.com
              DOMAIN=https://app.controleonline.com
              FTP=production
              NATIVE=true
              ;;
            *)
              echo "Ambiente inválido: $ENV (use dev|staging|master)"
              exit 1
              ;;
          esac
          {
            echo "env=$ENV"
            echo "api=$API"
            echo "socket=$SOCK"
            echo "domain=$DOMAIN"
            echo "ftp_profile=$FTP"
            echo "publish_native=$NATIVE"
            echo "web_app_type=MANAGER"
          } >> "$GITHUB_OUTPUT"
          echo "env=$ENV native=$NATIVE api=$API"

  # ─── 2. Web: MANAGER + SHOP + ADMIN (cada um no seu FTP) ───────────────────
  web:
    name: "2 · Web ${{ matrix.app_type }} (${{ needs.configure.outputs.env }})"
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_type: MANAGER
            ftp_product: manager
          - app_type: SHOP
            ftp_product: shop
          - app_type: ADMIN
            ftp_product: admin
    steps:
      - uses: actions/checkout@v5

      - name: FTP credentials (env × product)
        run: |
          set -e
          ENV_PROFILE="${{ needs.configure.outputs.ftp_profile }}"
          PRODUCT="${{ matrix.ftp_product }}"
          # Production: cada app_type tem host próprio
          # dev/staging: secrets de ambiente (STAGING_* / DEV_*)
          if [ "$ENV_PROFILE" = "production" ]; then
            case "$PRODUCT" in
              manager)
                echo "FTP_HOST=${{ secrets.FTPHOST }}" >> "$GITHUB_ENV"
                echo "FTP_USER=${{ secrets.FTPUSER }}" >> "$GITHUB_ENV"
                echo "FTP_PASS=${{ secrets.FTPPASS }}" >> "$GITHUB_ENV"
                ;;
              shop)
                echo "FTP_HOST=${{ secrets.SHOP_HOST }}" >> "$GITHUB_ENV"
                echo "FTP_USER=${{ secrets.SHOP_USER }}" >> "$GITHUB_ENV"
                echo "FTP_PASS=${{ secrets.SHOP_PASS }}" >> "$GITHUB_ENV"
                ;;
              admin)
                echo "FTP_HOST=${{ secrets.ADMIN_HOST }}" >> "$GITHUB_ENV"
                echo "FTP_USER=${{ secrets.ADMIN_USER }}" >> "$GITHUB_ENV"
                echo "FTP_PASS=${{ secrets.ADMIN_PASS }}" >> "$GITHUB_ENV"
                ;;
            esac
          elif [ "$ENV_PROFILE" = "staging" ]; then
            HOST="${{ secrets.STAGING_HOST }}"
            USER="${{ secrets.STAGING_USER }}"
            PASS="${{ secrets.STAGING_PASS }}"
            if [ -z "$HOST" ]; then
              HOST="${{ secrets.DEV_HOST }}"
              USER="${{ secrets.DEV_USER }}"
              PASS="${{ secrets.DEV_PASS }}"
            fi
            echo "FTP_HOST=$HOST" >> "$GITHUB_ENV"
            echo "FTP_USER=$USER" >> "$GITHUB_ENV"
            echo "FTP_PASS=$PASS" >> "$GITHUB_ENV"
          else
            # dev
            echo "FTP_HOST=${{ secrets.DEV_HOST }}" >> "$GITHUB_ENV"
            echo "FTP_USER=${{ secrets.DEV_USER }}" >> "$GITHUB_ENV"
            echo "FTP_PASS=${{ secrets.DEV_PASS }}" >> "$GITHUB_ENV"
          fi
          if [ -z "${FTP_HOST:-}" ] && [ -z "$(grep FTP_HOST "$GITHUB_ENV" | cut -d= -f2-)" ]; then
            echo "Missing FTP secrets for product=$PRODUCT env=$ENV_PROFILE"
          fi

      - uses: ./.github/actions/web-export-deploy
        with:
          app_type: ${{ matrix.app_type }}
          api_entrypoint: ${{ needs.configure.outputs.api }}
          socket: ${{ needs.configure.outputs.socket }}
          # DOMAIN omitido de propósito: web multi-tenant usa window.location.host no App-Domain
          remote_dir: "~/public_html"
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_APPLICATION_ID: ${{ secrets.NEW_RELIC_APPLICATION_ID }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_TRUST_KEY: ${{ secrets.NEW_RELIC_TRUST_KEY }}
          NEW_RELIC_BEACON: ${{ secrets.NEW_RELIC_BEACON }}
          NEW_RELIC_ERROR_BEACON: ${{ secrets.NEW_RELIC_ERROR_BEACON }}

  # ─── 3. Android AAB+APK (somente master) ───────────────────────────────────
  android:
    name: "3 · Android ${{ matrix.app_type }}"
    needs: configure
    if: needs.configure.outputs.publish_native == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_type: CHECKOUT
            display_name: Checkout
            track: internal
            release_status: draft
          - app_type: CRM
            display_name: CRM
            track: internal
            release_status: completed
          - app_type: DELIVERY
            display_name: Delivery
            track: internal
            release_status: draft
          - app_type: MANAGER
            display_name: Gestor
            track: internal
            release_status: completed
          - app_type: MENU
            display_name: Menu
            track: internal
            release_status: completed
          - app_type: POS
            display_name: PDV
            track: internal
            release_status: completed
          - app_type: PPC
            display_name: PCP
            track: internal
            release_status: completed
          - app_type: SERVICE
            display_name: Service
            track: internal
            release_status: completed
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/android-build
        with:
          app_type: ${{ matrix.app_type }}
          display_name: ${{ matrix.display_name }}
          api_entrypoint: ${{ needs.configure.outputs.api }}
          domain: ${{ needs.configure.outputs.domain }}
          manager_app: ${{ needs.configure.outputs.domain }}
          socket: ${{ needs.configure.outputs.socket }}
          build_aab: "true"
          build_apk: "true"
          publish_play: "true"
          publish_github: "true"
          play_track: ${{ matrix.track }}
          play_status: ${{ matrix.release_status }}
        env:
          CERT: ${{ secrets.CERT }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          GMAPS_GOOGLE_CLIENT_ID: ${{ secrets.GMAPS_GOOGLE_CLIENT_ID }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_APPLICATION_ID: ${{ secrets.NEW_RELIC_APPLICATION_ID }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_TRUST_KEY: ${{ secrets.NEW_RELIC_TRUST_KEY }}
          NEW_RELIC_BEACON: ${{ secrets.NEW_RELIC_BEACON }}
          NEW_RELIC_ERROR_BEACON: ${{ secrets.NEW_RELIC_ERROR_BEACON }}

  # ─── 4. LG webOS (somente master) ──────────────────────────────────────────
  lg-webos:
    name: "4 · LG webOS"
    needs: configure
    if: needs.configure.outputs.publish_native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lg-webos-build
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_APPLICATION_ID: ${{ secrets.NEW_RELIC_APPLICATION_ID }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_TRUST_KEY: ${{ secrets.NEW_RELIC_TRUST_KEY }}
          NEW_RELIC_BEACON: ${{ secrets.NEW_RELIC_BEACON }}
          NEW_RELIC_ERROR_BEACON: ${{ secrets.NEW_RELIC_ERROR_BEACON }}
