# Single Android entrypoint (Controle Online).
# Build logic: .github/actions/android-build
# AAB + APK → GitHub Releases + Play Store
name: Android

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_type: CHECKOUT
            display_name: Checkout
            track: internal
            release_status: draft
          - app_type: CRM
            display_name: CRM
            track: internal
            release_status: completed
          - app_type: DELIVERY
            display_name: Delivery
            track: internal
            release_status: draft
          - app_type: MANAGER
            display_name: Gestor
            track: internal
            release_status: completed
          - app_type: MENU
            display_name: Menu
            track: internal
            release_status: completed
          - app_type: POS
            display_name: PDV
            track: internal
            release_status: completed
          - app_type: PPC
            display_name: PCP
            track: internal
            release_status: completed
          - app_type: SERVICE
            display_name: Service
            track: internal
            release_status: completed

    steps:
      - uses: actions/checkout@v5

      - name: Android build & publish
        uses: ./.github/actions/android-build
        with:
          app_type: ${{ matrix.app_type }}
          display_name: ${{ matrix.display_name }}
          build_aab: "true"
          build_apk: "true"
          publish_play: "true"
          publish_github: "true"
          publish_ftp: "false"
          play_track: ${{ matrix.track }}
          play_status: ${{ matrix.release_status }}
        env:
          CERT: ${{ secrets.CERT }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          GMAPS_GOOGLE_CLIENT_ID: ${{ secrets.GMAPS_GOOGLE_CLIENT_ID }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_APPLICATION_ID: ${{ secrets.NEW_RELIC_APPLICATION_ID }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_TRUST_KEY: ${{ secrets.NEW_RELIC_TRUST_KEY }}
          NEW_RELIC_BEACON: ${{ secrets.NEW_RELIC_BEACON }}
          NEW_RELIC_ERROR_BEACON: ${{ secrets.NEW_RELIC_ERROR_BEACON }}

  after:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Trigger Lave-Go Cielo (FTP exception)
        continue-on-error: true
        run: gh workflow run android-lavego.yml --ref "${GITHUB_REF_NAME}" -f target=production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger LG webOS PPC
        continue-on-error: true
        run: gh workflow run lg-webos.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
