name: Stage Project Admin Ctrl
on:
  push:
    branches: [staging]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Creating Config
        run: |
          ZOOM=$(node -p "require('./config/env.local.sample').env.ZOOM ?? 100")
          echo "const env = {\
          API_ENTRYPOINT: 'https://s.controleonline.com',\
          HTACCESS_USER: '${{ secrets.HTACCESS_USER }}',\
          HTACCESS_PASSWORD: '${{ secrets.HTACCESS_PASSWORD }}',\
          SOCKET: 'wss://s.controleonline.com',\
          APP_TYPE: 'ADMIN',\
          APP_DISPLAY_NAME: 'Admin',\
          ZOOM: ${ZOOM},\
          NEW_RELIC:{\
            LICENSE_KEY:'${{ secrets.NEW_RELIC_LICENSE_KEY }}',\
            APPLICATION_ID:'${{ secrets.NEW_RELIC_APPLICATION_ID }}',\
            ACCOUNT_ID: '${{ secrets.NEW_RELIC_ACCOUNT_ID }}',\
            TRUST_KEY: '${{ secrets.NEW_RELIC_TRUST_KEY }}',\
            BEACON: '${{ secrets.NEW_RELIC_BEACON }}',\
            ERROR_BEACON: '${{ secrets.NEW_RELIC_ERROR_BEACON }}'\
          }\
          };\
          module.exports = { env };\
          " > ./config/env.local.js
      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --recursive --init --checkout
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Fix Expo Dependencies
        run: npx expo install --fix
      - name: Build
        run: npx expo export --platform web
      - name: Deploy
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.ADMIN_HOST }}
          user: ${{ secrets.ADMIN_USER }}
          password: ${{ secrets.ADMIN_PASS }}
          localDir: "./dist"
          remoteDir: "~/public_html"
          forceSsl: false
  tests:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Creating Config
        run: |
          ZOOM=$(node -p "require('./config/env.local.sample').env.ZOOM ?? 100")
          echo "const env = {\
          API_ENTRYPOINT: 'https://s.controleonline.com',\
          HTACCESS_USER: '${{ secrets.HTACCESS_USER }}',\
          HTACCESS_PASSWORD: '${{ secrets.HTACCESS_PASSWORD }}',\
          SOCKET: 'wss://s.controleonline.com',\
          APP_TYPE: 'ADMIN',\
          APP_DISPLAY_NAME: 'Admin',\
          ZOOM: ${ZOOM},\
          NEW_RELIC:{\
            LICENSE_KEY:'${{ secrets.NEW_RELIC_LICENSE_KEY }}',\
            APPLICATION_ID:'${{ secrets.NEW_RELIC_APPLICATION_ID }}',\
            ACCOUNT_ID: '${{ secrets.NEW_RELIC_ACCOUNT_ID }}',\
            TRUST_KEY: '${{ secrets.NEW_RELIC_TRUST_KEY }}',\
            BEACON: '${{ secrets.NEW_RELIC_BEACON }}',\
            ERROR_BEACON: '${{ secrets.NEW_RELIC_ERROR_BEACON }}'\
          }\
          };\
          module.exports = { env };\
          " > ./config/env.local.js
      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --recursive --init --checkout
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Fix Expo Dependencies
        run: npx expo install --fix
      - name: Run Automated Tests
        run: |
          rm -rf tests
          mkdir -p tests/automated
          npm run test:automated -- --json --outputFile=tests/automated/jest-results.json
      - name: Summarize Automated Tests
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const reportPath = 'tests/automated/jest-results.json';
          const summaryPath = 'tests/automated/summary.txt';
          const lines = [];

          if (fs.existsSync(reportPath)) {
            try {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              lines.push(`Status: ${report.success ? 'passed' : 'failed'}`);
              lines.push(`Suites: ${report.numPassedTestSuites}/${report.numTotalTestSuites} passed`);
              lines.push(`Tests: ${report.numPassedTests}/${report.numTotalTests} passed`);
              lines.push(`Snapshots: ${report.numPassedSnapshots || 0}/${report.numTotalSnapshots || 0} passed`);
            } catch (error) {
              lines.push(`Unable to parse automated test report: ${error.message}`);
            }
          } else {
            lines.push('Automated test report not found.');
          }

          fs.writeFileSync(summaryPath, `${lines.join('\n')}\n`, 'utf8');
          NODE
      - name: Install Playwright Browsers
        if: always()
        run: npx playwright install --with-deps chromium
      - name: Run Browser Smoke Tests
        if: always()
        run: npm run test:browser
      - name: Stage Browser Smoke Results
        if: always()
        run: |
          rm -rf tests/smoke
          mkdir -p tests/smoke/results
          cp -a .playwright-smoke-results/. tests/smoke/results/ 2>/dev/null || true
          if [ -f .playwright-smoke-results/summary.txt ]; then
            cp .playwright-smoke-results/summary.txt tests/smoke/summary.txt
          else
            printf '%s\n' 'Smoke test artifacts were not generated.' 'Check the workflow logs for the failing step.' > tests/smoke/summary.txt
          fi
      - name: Build Test Index
        if: always()
        run: npm run tests:index
      - name: Upload Test Results
        if: always()
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.ADMIN_HOST }}
          user: ${{ secrets.ADMIN_USER }}
          password: ${{ secrets.ADMIN_PASS }}
          localDir: "./tests"
          remoteDir: "~/public_html/tests"
          forceSsl: false
