# Cielo PDV Lave-Go STAGING — same core, staging endpoints if needed.
name: Cielo Deploy PDV LaveGo Staging

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/android-build.yml
    with:
      app_type: POS
      display_name: "PDV"
      package_name: "com.lavego.app"
      expo_name: "Lave-Go"
      expo_slug: "pos-controle-online"
      api_entrypoint: "https://s.controleonline.com"
      domain: "https://staging.controleonline.com"
      manager_app: "https://staging.controleonline.com"
      socket: "wss://s.controleonline.com"
      build_aab: false
      build_apk: true
      publish_play: false
      publish_github: false
      publish_ftp: true
      bump_version_code_from_package: true
    secrets:
      CERT: ${{ secrets.CERT }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GMAPS_GOOGLE_CLIENT_ID: ${{ secrets.GMAPS_GOOGLE_CLIENT_ID }}
      NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      NEW_RELIC_APPLICATION_ID: ${{ secrets.NEW_RELIC_APPLICATION_ID }}
      NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
      NEW_RELIC_TRUST_KEY: ${{ secrets.NEW_RELIC_TRUST_KEY }}
      NEW_RELIC_BEACON: ${{ secrets.NEW_RELIC_BEACON }}
      NEW_RELIC_ERROR_BEACON: ${{ secrets.NEW_RELIC_ERROR_BEACON }}
      FTPHOST: ${{ secrets.FTPHOST }}
      FTPUSER: ${{ secrets.FTPUSER }}
      FTPPASS: ${{ secrets.FTPPASS }}
