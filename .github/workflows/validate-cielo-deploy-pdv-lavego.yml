name: Validate Cielo Deploy PDV Lavego

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      APP_TYPE: POS
      APP_DISPLAY_NAME: PDV
      EXPECTED_PACKAGE_NAME: com.lavego.app
      ASSETS_VARIANT: pos_lavego

    steps:
      - uses: actions/checkout@v5

      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --recursive --init --checkout

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # ─────────────────────────────────────────────
      # 1. Secrets
      # ─────────────────────────────────────────────
      - name: Check Required Secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.CERT }}" ]                      && MISSING="${MISSING} CERT"
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && MISSING="${MISSING} ANDROID_KEYSTORE_PASSWORD"
          [ -z "${{ secrets.FTPHOST }}" ]                   && MISSING="${MISSING} FTPHOST"
          [ -z "${{ secrets.FTPUSER }}" ]                   && MISSING="${MISSING} FTPUSER"
          [ -z "${{ secrets.FTPPASS }}" ]                   && MISSING="${MISSING} FTPPASS"
          [ -z "${{ secrets.GMAPS_GOOGLE_CLIENT_ID }}" ]    && MISSING="${MISSING} GMAPS_GOOGLE_CLIENT_ID"
          [ -z "${{ secrets.NEW_RELIC_LICENSE_KEY }}" ]     && MISSING="${MISSING} NEW_RELIC_LICENSE_KEY"
          [ -z "${{ secrets.NEW_RELIC_APPLICATION_ID }}" ]  && MISSING="${MISSING} NEW_RELIC_APPLICATION_ID"
          [ -z "${{ secrets.NEW_RELIC_ACCOUNT_ID }}" ]      && MISSING="${MISSING} NEW_RELIC_ACCOUNT_ID"
          [ -z "${{ secrets.NEW_RELIC_TRUST_KEY }}" ]       && MISSING="${MISSING} NEW_RELIC_TRUST_KEY"
          [ -z "${{ secrets.NEW_RELIC_BEACON }}" ]          && MISSING="${MISSING} NEW_RELIC_BEACON"
          [ -z "${{ secrets.NEW_RELIC_ERROR_BEACON }}" ]    && MISSING="${MISSING} NEW_RELIC_ERROR_BEACON"

          if [ -n "$MISSING" ]; then
            echo "ERRO: Secrets ausentes ou vazios:"
            for S in $MISSING; do echo "  - $S"; done
            exit 1
          fi
          echo "OK: Todos os 12 secrets necessarios estao configurados."

      # ─────────────────────────────────────────────
      # 2. Keystore
      # ─────────────────────────────────────────────
      - name: Validate Android Keystore (CERT / alias controle-online)
        run: |
          printf '%s' "${{ secrets.CERT }}" | base64 -d > /tmp/controle-online.keystore
          keytool -list \
            -keystore /tmp/controle-online.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias controle-online
          rm -f /tmp/controle-online.keystore
          echo "OK: Keystore valido, alias controle-online encontrado."

      # ─────────────────────────────────────────────
      # 3. Package name — ponto central do problema
      # ─────────────────────────────────────────────
      - name: Validate Package Name in app.json
        run: |
          APP_JSON_PKG=$(node -e "
            const app = require('./app.json');
            const android = app.expo?.android || {};
            console.log(android.applicationId || android.package || '');
          ")

          echo "---------------------------------------------------"
          echo "Package name no app.json:   '${APP_JSON_PKG}'"
          echo "Package name do workflow:   '${EXPECTED_PACKAGE_NAME}'"
          echo "---------------------------------------------------"

          if [ "${APP_JSON_PKG}" = "${EXPECTED_PACKAGE_NAME}" ]; then
            echo "OK: Package names batem."
          else
            echo ""
            echo "[PROBLEMA CRITICO] O app.json tem '${APP_JSON_PKG}'."
            echo "  O workflow define PACKAGE_NAME='${EXPECTED_PACKAGE_NAME}' mas"
            echo "  nao ha nenhuma etapa que altere o app.json antes do prebuild."
            echo "  O APK sera compilado com '${APP_JSON_PKG}' — a Cielo vai rejeitar."
            echo ""
            echo "  CORRECAO: adicionar antes do passo 'Prebuild' em cielo-deploy-pdv-lavego.yml:"
            echo ""
            echo "    - name: Update app.json package name"
            echo "      run: |"
            ESCAPED=$(echo "${APP_JSON_PKG}" | sed 's/\./\\./g')
            echo "        sed -i 's/${ESCAPED}/${EXPECTED_PACKAGE_NAME}/g' app.json"
            exit 1
          fi

      # ─────────────────────────────────────────────
      # 4. Versão e caminhos FTP
      # ─────────────────────────────────────────────
      - name: Show Version and FTP Paths
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./package.json').version" | tr -d '.')
          echo "Versao:       ${VERSION}"
          echo "Version code: ${VERSION_CODE}"
          echo ""
          echo "FTP localDir:  ./android/app/build/outputs/apk/release"
          echo "FTP remoteDir: public_html/${VERSION}/${EXPECTED_PACKAGE_NAME}/apk"

      # ─────────────────────────────────────────────
      # 5. Config gerado (sem expor secrets)
      # ─────────────────────────────────────────────
      - name: Show Generated Config (secrets omitidos)
        run: |
          echo "=== ./config/env.local.js que seria gerado ==="
          cat <<'EOF'
          const env = {
            API_ENTRYPOINT: 'https://apinew.lave-go.com',
            DOMAIN:         'https://app.lave-go.com',
            MANAGER_APP:    'https://app.lave-go.com',
            SOCKET:         'wss://apinew.lave-go.com',
            APP_TYPE:       'POS',
            COMPANY_NAME:   'lavego',
            ZOOM:           0.80,
            NEW_RELIC: {
              LICENSE_KEY:    '***',
              APPLICATION_ID: '***',
              ACCOUNT_ID:     '***',
              TRUST_KEY:      '***',
              BEACON:         '***',
              ERROR_BEACON:   '***'
            }
          };
          module.exports = { env };
          EOF

      # ─────────────────────────────────────────────
      # 6. Arquivos necessários
      # ─────────────────────────────────────────────
      - name: Check signing.gradle
        run: |
          if [ -f signing.gradle ]; then
            echo "OK: signing.gradle encontrado na raiz."
          else
            echo "ERRO: signing.gradle nao encontrado."
            exit 1
          fi

      - name: Check configure-assets-lavego2.js
        run: |
          if [ -f scripts/configure-assets-lavego2.js ]; then
            echo "OK: scripts/configure-assets-lavego2.js encontrado."
          else
            echo "ERRO: scripts/configure-assets-lavego2.js nao encontrado."
            exit 1
          fi

      # ─────────────────────────────────────────────
      # 7. Resumo final (sempre executa)
      # ─────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          VERSION=$(node -p "require('./app.json').expo.version" 2>/dev/null || echo "erro")
          APP_JSON_PKG=$(node -e "
            const app = require('./app.json');
            const android = app.expo?.android || {};
            console.log(android.applicationId || android.package || '(nao encontrado)');
          " 2>/dev/null || echo "erro")

          echo "==========================================="
          echo "         RESUMO DA VALIDACAO"
          echo "==========================================="
          echo " App Type:                   POS"
          echo " Versao (app.json):          ${VERSION}"
          echo " Package name (app.json):    ${APP_JSON_PKG}"
          echo " Package name (workflow):    ${EXPECTED_PACKAGE_NAME}"
          echo " Keystore alias:             controle-online"
          echo " FTP remoteDir:              public_html/${VERSION}/${EXPECTED_PACKAGE_NAME}/apk"
          echo "==========================================="
          if [ "${APP_JSON_PKG}" != "${EXPECTED_PACKAGE_NAME}" ]; then
            echo " [ATENCAO] Package name divergente — APK sera rejeitado pela Cielo."
          else
            echo " [OK] Tudo validado com sucesso."
          fi
          echo "==========================================="