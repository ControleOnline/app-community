name: FTP Test

on:
  workflow_dispatch:

jobs:
  test-ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Debug FTP connection
        run: |
          echo "=== Host sendo usado ==="
          echo "${{ secrets.FTP_HOST }}"

          echo "=== Resolvendo DNS ==="
          nslookup ${{ secrets.FTP_HOST }} || echo "❌ DNS falhou!"

          echo "=== Testando porta 21 ==="
          nc -zv -w5 ${{ secrets.FTP_HOST }} 21 && echo "✅ Porta 21 aberta" || echo "❌ Porta 21 bloqueada!"

          echo "=== Testando porta 22 (SFTP) ==="
          nc -zv -w5 ${{ secrets.FTP_HOST }} 22 && echo "✅ Porta 22 aberta" || echo "❌ Porta 22 bloqueada!"