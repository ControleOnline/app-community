name: FTP Test

on:
  workflow_dispatch:

jobs:
  test-ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Create test file
        run: echo "FTP funcionando! $(date)" > teste.txt

      - name: Test FTP connection with lftp
        run: |
          sudo apt-get install -y lftp
          lftp -d \
            -u "${{ secrets.FTP_USER }},${{ secrets.FTP_PASSWORD }}" \
            -e "set ftp:passive-mode yes; ls; bye" \
            ftp://${{ secrets.FTP_HOST }} || echo "❌ Conexão falhou!"