name: Validate Google Play Permission

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.lavego.shop

    steps:
      - name: Decode Service Account
        shell: bash
        run: |
          printf '%s' "${{ secrets.LAVEGO_SHOP_SERVICE_ACCOUNT }}" | base64 -d > /tmp/service_account.json

      - name: Validate Google Play Edit Permission
        shell: bash
        run: |
          npm install googleapis@latest

          node <<'NODE'
          const { google } = require('googleapis');

          const packageName = process.env.PACKAGE_NAME;
          const keyFile = '/tmp/service_account.json';

          async function main() {
            const auth = new google.auth.GoogleAuth({
              keyFile,
              scopes: ['https://www.googleapis.com/auth/androidpublisher'],
            });

            const androidpublisher = google.androidpublisher({
              version: 'v3',
              auth,
            });

            const edit = await androidpublisher.edits.insert({
              packageName,
            });

            console.log('OK: permissão válida.');
            console.log('Edit ID:', edit.data.id);

            await androidpublisher.edits.delete({
              packageName,
              editId: edit.data.id,
            });

            console.log('OK: edit removido.');
          }

          main().catch((error) => {
            console.error('ERRO:', error.response?.data || error.message);
            process.exit(1);
          });
          NODE