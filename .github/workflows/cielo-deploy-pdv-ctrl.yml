# Cielo PDV — Controle Online.
# Artefatos (AAB + APK) → GitHub Releases (sem FTP).
# Filename kept for: gh workflow run cielo-deploy-pdv-ctrl.yml
name: Cielo Deploy PDV Ctrl

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/android-build.yml
    with:
      app_type: POS
      display_name: "PDV"
      package_name: "com.controleonline.pos"
      build_aab: true
      build_apk: true
      publish_play: false
      publish_github: true
      publish_ftp: false
      bump_version_code_from_package: true
    secrets:
      CERT: ${{ secrets.CERT }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GMAPS_GOOGLE_CLIENT_ID: ${{ secrets.GMAPS_GOOGLE_CLIENT_ID }}
      NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      NEW_RELIC_APPLICATION_ID: ${{ secrets.NEW_RELIC_APPLICATION_ID }}
      NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
      NEW_RELIC_TRUST_KEY: ${{ secrets.NEW_RELIC_TRUST_KEY }}
      NEW_RELIC_BEACON: ${{ secrets.NEW_RELIC_BEACON }}
      NEW_RELIC_ERROR_BEACON: ${{ secrets.NEW_RELIC_ERROR_BEACON }}
