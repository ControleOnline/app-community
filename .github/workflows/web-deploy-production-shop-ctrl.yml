name: Deploy Project Shop Ctrl
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Collect Candidate SHAs
        run: |
          PARENTS=$(git rev-list --parents -n 1 HEAD | cut -d' ' -f2-)
          echo "CANDIDATE_SHAS=${GITHUB_SHA} ${PARENTS}" >> "$GITHUB_ENV"
      - name: Confirm Staging Success
        uses: actions/github-script@v7
        env:
          STAGING_WORKFLOW_ID: web-deploy-staging-shop-ctrl.yml
        with:
          script: |
            const workflowId = process.env.STAGING_WORKFLOW_ID;
            const candidateShas = new Set((process.env.CANDIDATE_SHAS || '').split(/\s+/).filter(Boolean));
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              branch: 'staging',
              event: 'push',
              status: 'completed',
              per_page: 100,
            });
            const passed = runs.find((run) => run.conclusion === 'success' && candidateShas.has(run.head_sha));
            if (!passed) {
              core.setFailed(`No successful staging run found for ${workflowId} on ${[...candidateShas].join(', ')}`);
              return;
            }
            core.info(`Matched staging run ${passed.id} for ${passed.head_sha}.`);
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Creating Config
        run: |
          echo "const env = {\
          API_ENTRYPOINT: 'https://api.controleonline.com',\
          SOCKET: 'wss://api.controleonline.com',\
          APP_TYPE: 'SHOP',\
          COMPANY_NAME: 'CTRL',\
          ZOOM: 0.80,\
          NEW_RELIC:{\
            LICENSE_KEY:'${{ secrets.NEW_RELIC_LICENSE_KEY }}',\
            APPLICATION_ID:'${{ secrets.NEW_RELIC_APPLICATION_ID }}',\
            ACCOUNT_ID: '${{ secrets.NEW_RELIC_ACCOUNT_ID }}',\
            TRUST_KEY: '${{ secrets.NEW_RELIC_TRUST_KEY }}',\
            BEACON: '${{ secrets.NEW_RELIC_BEACON }}',\
            ERROR_BEACON: '${{ secrets.NEW_RELIC_ERROR_BEACON }}'\
          }\
          };\
          module.exports = { env };\
          " > ./config/env.local.js
      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --recursive --init --checkout
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Fix Expo Dependencies
        run: npx expo install --fix
      - name: Build
        run: npx expo export --platform web
      - name: Deploy
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.SHOP_HOST }}
          user: ${{ secrets.SHOP_USER }}
          password: ${{ secrets.SHOP_PASSWORD }}
          localDir: "./dist"
          remoteDir: "~/public_html"
          forceSsl: false
