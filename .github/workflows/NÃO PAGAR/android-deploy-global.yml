name: Deploy Android Apps # NÃO MUDAR ESSE NOME!!!
# caso precise mudar, tem que alterar também dentro do script da Cielo
# cielo-deploy-pdv-ctrl.yml
# cielo-deploy-pdv-lavego.yml

on:
  push:
    branches: [production]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app_type: CHECKOUT
            display_name: "Checkout"
            track: internal
            release_status: draft
            changes_not_sent_for_review: true

          - app_type: CRM
            display_name: "CRM"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true

          - app_type: DELIVERY
            display_name: "Delivery"
            track: internal
            release_status: draft
            changes_not_sent_for_review: true

          - app_type: MANAGER
            display_name: "Gestor"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true

          - app_type: MENU
            display_name: "Menu"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true

          - app_type: POS
            display_name: "PDV"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true

          - app_type: PPC
            display_name: "PCP"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true

          - app_type: SERVICE
            display_name: "Service"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true

    env:
      APP_TYPE: ${{ matrix.app_type }}
      APP_DISPLAY_NAME: ${{ matrix.display_name }}
      GMAPS_GOOGLE_CLIENT_ID: ${{ secrets.GMAPS_GOOGLE_CLIENT_ID }}
      EXPO_PUBLIC_GMAPS_GOOGLE_CLIENT_ID: ${{ secrets.GMAPS_GOOGLE_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v5

      - name: Set Dynamic Package Name
        run: |
          APP_LOWER=$(echo "${APP_TYPE}" | tr '[:upper:]' '[:lower:]')
          echo "PACKAGE_NAME=com.controleonline.${APP_LOWER}" >> $GITHUB_ENV
          echo "AAB_ARTIFACT_NAME=android-aab-${APP_LOWER}" >> $GITHUB_ENV
          echo "APK_ARTIFACT_NAME=android-apk-${APP_LOWER}" >> $GITHUB_ENV

      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --recursive --init --checkout

      - uses: gradle/actions/setup-gradle@v3

      - uses: amyu/setup-android@v4
        with:
          sdk-version: 36
          build-tools-version: 36.0.0
          ndk-version: 27.1.12297006

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Generate Dynamic Configs
        run: |
          APP_LOWER=$(echo "${APP_TYPE}" | tr '[:upper:]' '[:lower:]')

          ZOOM=$(node -p "require('./config/env.local.sample').env.ZOOM ?? 100")

          echo "const env = {\
          API_ENTRYPOINT: 'https://api.controleonline.com',\
          DOMAIN: 'https://app.controleonline.com',\
          MANAGER_APP: 'https://app.controleonline.com',\
          SOCKET: 'wss://api.controleonline.com',\
          APP_TYPE: '${APP_TYPE}',\
          ZOOM: ${ZOOM},\
          NEW_RELIC:{\
            LICENSE_KEY:'${{ secrets.NEW_RELIC_LICENSE_KEY }}',\
            APPLICATION_ID:'${{ secrets.NEW_RELIC_APPLICATION_ID }}',\
            ACCOUNT_ID:'${{ secrets.NEW_RELIC_ACCOUNT_ID }}',\
            TRUST_KEY:'${{ secrets.NEW_RELIC_TRUST_KEY }}',\
            BEACON:'${{ secrets.NEW_RELIC_BEACON }}',\
            ERROR_BEACON:'${{ secrets.NEW_RELIC_ERROR_BEACON }}'\
          }\
          };\
          module.exports = { env };" > ./config/env.local.js

      - name: Update app.json dynamically
        run: |
          APP_LOWER=$(echo "${APP_TYPE}" | tr '[:upper:]' '[:lower:]')
          sed -i "s/On Gestor/On ${APP_DISPLAY_NAME}/g" app.json
          sed -i "s/controleonline\.manager/controleonline.${APP_LOWER}/g" app.json
          sed -i "s/manager-controle-online/${APP_LOWER}-controle-online/g" app.json

      - name: Configure Assets by APP_TYPE
        run: node scripts/configure-assets.js
        env:
          APP_TYPE: ${{ env.APP_TYPE }}

      - name: Install Dependencies
        run: npm install

      - name: Fix Expo Dependencies
        run: npx expo install --fix

      - name: Create Firebase Android Config
        if: matrix.app_type == 'MANAGER'
        env:
          FIREBASE_MANAGER_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_MANAGER_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${FIREBASE_MANAGER_GOOGLE_SERVICES_JSON}" ]; then
            echo "Secret FIREBASE_MANAGER_GOOGLE_SERVICES_JSON nao configurado." >&2
            exit 1
          fi

          mkdir -p ./config/firebase
          printf '%s' "${FIREBASE_MANAGER_GOOGLE_SERVICES_JSON}" > ./config/firebase/manager.local.json
          python3 -m json.tool ./config/firebase/manager.local.json > /dev/null
          echo "FIREBASE_ANDROID_GOOGLE_SERVICES_FILE=./config/firebase/manager.local.json" >> "$GITHUB_ENV"

      - name: Prebuild
        run: npx expo prebuild --clean

      - name: Create Android Signing Files
        run: |
          mkdir -p ./config/android
          echo "${{ secrets.CERT }}" | base64 -d > ./config/android/controle-online.keystore
          echo "MYAPP_UPLOAD_STORE_FILE=./config/android/controle-online.keystore" > ./config/android/env.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=controle-online" >> ./config/android/env.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> ./config/android/env.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> ./config/android/env.properties

      - name: Build Android Release
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease --init-script ../signing.gradle \
            -Dorg.gradle.jvmargs="-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

      - name: Extract App Version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Show Version (v.${{ env.VERSION }})
        run: echo "Compilando versão ${{ env.VERSION }}"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AAB_ARTIFACT_NAME }}
          path: ./android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: ./android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_LOWER=$(echo "${APP_TYPE}" | tr '[:upper:]' '[:lower:]')
          RELEASE_TAG="android-${APP_LOWER}-v${VERSION}"
          RELEASE_TITLE="Android ${APP_DISPLAY_NAME} v${VERSION}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              ./android/app/build/outputs/bundle/release/app-release.aab \
              ./android/app/build/outputs/apk/release/app-release.apk \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              ./android/app/build/outputs/bundle/release/app-release.aab \
              ./android/app/build/outputs/apk/release/app-release.apk \
              --title "${RELEASE_TITLE}" \
              --notes "Android release for ${APP_DISPLAY_NAME} v${VERSION}."
          fi

      - name: Decode Service Account
        run: echo "${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}" | base64 -d > /tmp/service_account.json

      - name: Upload .aab to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: /tmp/service_account.json
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ matrix.track }}
          status: ${{ matrix.release_status }}
          changesNotSentForReview: ${{ matrix.changes_not_sent_for_review }}

      # para executar o script da CIELO para CONTROLE ONLINE, depois que terminar os outros
      - name: Trigger Cielo Deploy PDV / CONTROLE ONLINE
        if: matrix.app_type == 'POS'
        # NÃO ALTERAR O NOME DO YML
        run: |
          gh workflow run cielo-deploy-pdv-ctrl.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # para executar o script da CIELO para LAVE-GO, depois que terminar os outros
      - name: Trigger Cielo Deploy PDV / LAVE-GO
        if: matrix.app_type == 'POS'
        # NÃO ALTERAR O NOME DO YML
        run: |
          gh workflow run cielo-deploy-pdv-lavego.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # para executar o script da LG/webOS para PPC
      - name: Trigger LG webOS Deploy PPC
        if: matrix.app_type == 'PPC'
        run: |
          gh workflow run lg-webos-deploy-ppc.yml --ref "${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
