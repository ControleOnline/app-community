name: TESTE RAPIDO FTP SEM COMPILACAO

on:
  workflow_dispatch:

jobs:
  teste_envio:
    runs-on: ubuntu-latest

    steps:
      - name: Criar APK falso e Pasta Temporaria
        run: |
          mkdir -p ./android/app/build/outputs/apk
          echo "Este e um arquivo APK falso para teste de conexao FTP" > ./android/app/build/outputs/apk/app-release-fake.apk
          
          echo "APK_DIR=./android/app/build/outputs/apk" >> "$GITHUB_ENV"
          echo "APK_FILENAME=app-release-fake.apk" >> "$GITHUB_ENV"
          echo "APP_VERSION=1.7.4_teste" >> "$GITHUB_ENV"

      - name: Deploy APK Falso para Extra FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTPHOST_EXTRASLAVEGO }}
          username: ${{ secrets.FTPUSER_EXTRASLAVEGO }}
          password: ${{ secrets.FTPPASS_EXTRASLAVEGO }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ${{ env.APK_DIR }}/
          server-dir: /${{ env.APP_VERSION }}/

      - name: Validar se o arquivo realmente subiu para o FTP (Via curl)
        run: |
          # Monta a URL exata do arquivo usando as variáveis do GitHub
          REMOTE_FILE_URL="ftp://${{ secrets.FTPHOST_EXTRASLAVEGO }}/${{ env.APP_VERSION }}/${{ env.APK_FILENAME }}"
          
          echo "Verificando a existência do arquivo em: $REMOTE_FILE_URL"
          
          # Executa o curl com o --ftp-ssl-reqd que você testou no seu Mac.
          # O parâmetro --head (-I) serve apenas para checar se o arquivo existe sem baixar o conteúdo inteiro.
          curl --ftp-ssl-reqd -k -s -I \
            -u "${{ secrets.FTPUSER_EXTRASLAVEGO }}:${{ secrets.FTPPASS_EXTRASLAVEGO }}" \
            "$REMOTE_FILE_URL"
          
          # Se o curl retornar um código diferente de 0, significa que o arquivo não existe ou a conexão falhou
          if [ $? -eq 0 ]; then
            echo "SUCESSO: O arquivo ${{ env.APK_FILENAME }} foi encontrado no FTP!"
          else
            echo "ERRO CRITICO: O arquivo ${{ env.APK_FILENAME }} NÃO foi localizado na pasta remoto." >&2
            exit 1
          fi
