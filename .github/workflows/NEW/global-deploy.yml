# global-deploy.yml
# ORQUESTRADOR MASTER
# Dispara Android + Web em paralelo

name: Global Deploy

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Global Deploy Android
        run: |
          gh workflow run global-deploy-android.yml --ref "${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Global Deploy Web
        run: |
          gh workflow run global-deploy-web.yml --ref "${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}