name: Deploy Cielo PDV CONTROLE ONLINE

on:
  workflow_run:
    workflows: ["Deploy Android Apps"]
    types: [completed]
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app_type: POS
            display_name: "PDV"

    env:
      APP_TYPE: ${{ matrix.app_type }}
      APP_DISPLAY_NAME: ${{ matrix.display_name }}
      GMAPS_GOOGLE_CLIENT_ID: ${{ secrets.GMAPS_GOOGLE_CLIENT_ID }}
      EXPO_PUBLIC_GMAPS_GOOGLE_CLIENT_ID: ${{ secrets.GMAPS_GOOGLE_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v5

      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --recursive --init --checkout

      - uses: gradle/actions/setup-gradle@v3

      - uses: amyu/setup-android@v4
        with:
          sdk-version: 36
          build-tools-version: 36.0.0
          ndk-version: 27.1.12297006

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Generate Dynamic Configs
        run: |
          ZOOM=$(node -p "require('./config/env.local.sample').env.ZOOM ?? 100")

          echo "const env = {\
          API_ENTRYPOINT: 'https://api.controleonline.com',\
          DOMAIN: 'https://app.controleonline.com',\
          MANAGER_APP: 'https://app.controleonline.com',\
          SOCKET: 'wss://api.controleonline.com',\
          APP_TYPE: '${APP_TYPE}',\
          ZOOM: ${ZOOM},\
          NEW_RELIC:{\
            LICENSE_KEY:'${{ secrets.NEW_RELIC_LICENSE_KEY }}',\
            APPLICATION_ID:'${{ secrets.NEW_RELIC_APPLICATION_ID }}',\
            ACCOUNT_ID:'${{ secrets.NEW_RELIC_ACCOUNT_ID }}',\
            TRUST_KEY:'${{ secrets.NEW_RELIC_TRUST_KEY }}',\
            BEACON:'${{ secrets.NEW_RELIC_BEACON }}',\
            ERROR_BEACON:'${{ secrets.NEW_RELIC_ERROR_BEACON }}'\
          }\
          };\
          module.exports = { env };" > ./config/env.local.js

      - name: Install Dependencies
        run: npm install

      - name: Prebuild
        run: npx expo prebuild --clean

      - name: Validate vector icon fonts hook
        run: grep -q 'react-native-vector-icons/fonts.gradle' android/app/build.gradle

      - name: Create Android Signing Files
        run: |
          mkdir -p ./config/android
          echo "${{ secrets.CERT }}" | base64 -d > ./config/android/controle-online.keystore
          echo "MYAPP_UPLOAD_STORE_FILE=./config/android/controle-online.keystore" > ./config/android/env.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=controle-online" >> ./config/android/env.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> ./config/android/env.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> ./config/android/env.properties

      - name: Update versionCode
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(echo $VERSION | tr -d '.')
          node -e "
            const fs = require('fs');
            const app = require('./app.json');
            app.expo.android.versionCode = parseInt('$VERSION_CODE');
            fs.writeFileSync('./app.json', JSON.stringify(app, null, 2));
          "

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease --init-script ../signing.gradle

      - name: Locate APK
        run: |
          APK_PATH=$(find ./android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK não encontrado"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK_FILENAME=$(basename "$APK_PATH")" >> $GITHUB_ENV

      - name: Extract Version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set Package Name
        run: echo "PACKAGE_NAME=com.controleonline.pos" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cielo-apk-controle-pos
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Push APK to FTP (centralizado)
        uses: ./.github/workflows/push-to-ftp-server.yml
        with:
          source_run_id: ${{ github.run_id }}
          artifact_name: cielo-apk-controle-pos
          version: ${{ env.VERSION }}
          package_name: ${{ env.PACKAGE_NAME }}
          artifact_type: apk