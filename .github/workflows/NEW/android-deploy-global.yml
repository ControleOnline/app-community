name: Deploy Android Apps # NÃO MUDAR ESSE NOME!!!

on:
  push:
    branches: [production]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app_type: CHECKOUT
            display_name: "Checkout"
            track: internal
            release_status: draft
            changes_not_sent_for_review: true

          - app_type: CRM
            display_name: "CRM"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true

          - app_type: DELIVERY
            display_name: "Delivery"
            track: internal
            release_status: draft
            changes_not_sent_for_review: true

          - app_type: MANAGER
            display_name: "Gestor"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true

          - app_type: MENU
            display_name: "Menu"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true

          - app_type: POS
            display_name: "PDV"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true

          - app_type: PPC
            display_name: "PCP"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true

          - app_type: SERVICE
            display_name: "Service"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true

    env:
      APP_TYPE: ${{ matrix.app_type }}
      APP_DISPLAY_NAME: ${{ matrix.display_name }}
      GMAPS_GOOGLE_CLIENT_ID: ${{ secrets.GMAPS_GOOGLE_CLIENT_ID }}
      EXPO_PUBLIC_GMAPS_GOOGLE_CLIENT_ID: ${{ secrets.GMAPS_GOOGLE_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v5

      - name: Set Dynamic Package Name
        run: |
          APP_LOWER=$(echo "${APP_TYPE}" | tr '[:upper:]' '[:lower:]')
          echo "PACKAGE_NAME=com.controleonline.${APP_LOWER}" >> $GITHUB_ENV
          echo "FTP_ARTIFACT_NAME=android-aab-${APP_LOWER}" >> $GITHUB_ENV

      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --recursive --init --checkout

      - uses: gradle/actions/setup-gradle@v3

      - uses: amyu/setup-android@v4
        with:
          sdk-version: 36
          build-tools-version: 36.0.0
          ndk-version: 27.1.12297006

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Generate Dynamic Configs
        run: |
          ZOOM=$(node -p "require('./config/env.local.sample').env.ZOOM ?? 100")

          echo "const env = {\
          API_ENTRYPOINT: 'https://api.controleonline.com',\
          DOMAIN: 'https://app.controleonline.com',\
          MANAGER_APP: 'https://app.controleonline.com',\
          SOCKET: 'wss://api.controleonline.com',\
          APP_TYPE: '${APP_TYPE}',\
          ZOOM: ${ZOOM},\
          NEW_RELIC:{\
            LICENSE_KEY:'${{ secrets.NEW_RELIC_LICENSE_KEY }}',\
            APPLICATION_ID:'${{ secrets.NEW_RELIC_APPLICATION_ID }}',\
            ACCOUNT_ID:'${{ secrets.NEW_RELIC_ACCOUNT_ID }}',\
            TRUST_KEY:'${{ secrets.NEW_RELIC_TRUST_KEY }}',\
            BEACON:'${{ secrets.NEW_RELIC_BEACON }}',\
            ERROR_BEACON:'${{ secrets.NEW_RELIC_ERROR_BEACON }}'\
          }\
          };\
          module.exports = { env };" > ./config/env.local.js

      - name: Install Dependencies
        run: npm install

      - name: Fix Expo Dependencies
        run: npx expo install --fix

      - name: Prebuild
        run: npx expo prebuild --clean

      - name: Create Android Signing Files
        run: |
          mkdir -p ./config/android
          echo "${{ secrets.CERT }}" | base64 -d > ./config/android/controle-online.keystore
          echo "MYAPP_UPLOAD_STORE_FILE=./config/android/controle-online.keystore" > ./config/android/env.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=controle-online" >> ./config/android/env.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> ./config/android/env.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> ./config/android/env.properties

      - name: Build Android Bundle
        run: |
          cd android
          ./gradlew bundleRelease --init-script ../signing.gradle \
            -Dorg.gradle.jvmargs="-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

      - name: Extract App Version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FTP_ARTIFACT_NAME }}
          path: ./android/app/build/outputs/bundle/release
          if-no-files-found: error
          retention-days: 7

      # ✅ NOVO FTP CENTRALIZADO
      - name: Push AAB to FTP
        uses: ./.github/workflows/push-to-ftp-server.yml
        with:
          source_run_id: ${{ github.run_id }}
          artifact_name: ${{ env.FTP_ARTIFACT_NAME }}
          version: ${{ env.VERSION }}
          package_name: ${{ env.PACKAGE_NAME }}
          artifact_type: aab

      - name: Decode Service Account
        run: echo "${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}" | base64 -d > /tmp/service_account.json

      - name: Upload .aab to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: /tmp/service_account.json
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ matrix.track }}
          status: ${{ matrix.release_status }}
          changesNotSentForReview: ${{ matrix.changes_not_sent_for_review }}

      - name: Trigger Cielo Deploy PDV / CONTROLE ONLINE
        if: matrix.app_type == 'POS'
        run: gh workflow run cielo-deploy-pdv-ctrl.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Cielo Deploy PDV / LAVE-GO
        if: matrix.app_type == 'POS'
        run: gh workflow run cielo-deploy-pdv-lavego.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger LG webOS Deploy PPC
        if: matrix.app_type == 'PPC'
        run: gh workflow run lg-webos-deploy-ppc.yml --ref "${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}