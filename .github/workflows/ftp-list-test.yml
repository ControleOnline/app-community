name: FTP DIRECTORY LIST TEST

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a ser listada (ex: 1.4.3)"
        required: true
        default: "1.4.3"
        type: string
      package_name:
        description: "Package (ex: com.lavego.app)"
        required: true
        default: "com.lavego.app"
        type: string

jobs:
  list-directory:
    runs-on: ubuntu-latest

    steps:
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Connect and List Directory
        run: |
          VERSION="${{ inputs.version }}"
          PACKAGE="${{ inputs.package_name }}"

          # IMPORTANTE:
          # O root do FTP já é public_html
          REMOTE_DIR="${VERSION}/${PACKAGE}/apk"

          echo
          echo "============================================================"
          echo "Conectando ao FTP..."
          echo "Host: ${{ secrets.FTPHOST }}"
          echo "Diretório que será listado:"
          echo "$REMOTE_DIR"
          echo "============================================================"
          echo

          lftp -u "${{ secrets.FTPUSER }},${{ secrets.FTPPASS }}" "ftp://${{ secrets.FTPHOST }}" -e "
            set cmd:fail-exit yes
            set net:timeout 20
            set net:max-retries 1
            set ftp:passive-mode true
            set ssl:verify-certificate no

            echo ===== DIRETÓRIO ATUAL (PWD) =====
            pwd

            echo ===== LISTAGEM DA RAIZ FTP =====
            cls -la

            echo ===== ENTRANDO NO DIRETÓRIO =====
            cd ${REMOTE_DIR}

            echo ===== LISTAGEM REAL DO DIRETÓRIO =====
            cls -la
            echo ======================================

            bye
          "

          echo
          echo "✅ Diretório listado com sucesso."