name: FTP DIRECTORY LIST TEST

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a ser listada (ex: 1.4.3)"
        required: true
        default: "1.4.3"
        type: string
      package_name:
        description: "Package (ex: com.lavego.app)"
        required: true
        default: "com.lavego.app"
        type: string

jobs:
  list-directory:
    runs-on: ubuntu-latest

    steps:
      - name: Install curl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl

      - name: List FTP Directory (ROOT CHECK)
        run: |
          VERSION="${{ inputs.version }}"
          PACKAGE="${{ inputs.package_name }}"

          REMOTE_PATH="${VERSION}/${PACKAGE}/apk/"

          echo
          echo "============================================================"
          echo "Conectando ao FTP com curl..."
          echo "Host: ${{ secrets.FTPHOST }}"
          echo "Caminho: $REMOTE_PATH"
          echo "============================================================"
          echo

          echo "===== LISTAGEM DA RAIZ FTP ====="
          curl -v --user "${{ secrets.FTPUSER }}:${{ secrets.FTPPASS }}" \
               "ftp://${{ secrets.FTPHOST }}/" \
               --ftp-pasv || exit 1

          echo
          echo "===== LISTAGEM DO DIRETÓRIO DESEJADO ====="
          curl -v --user "${{ secrets.FTPUSER }}:${{ secrets.FTPPASS }}" \
               "ftp://${{ secrets.FTPHOST }}/${REMOTE_PATH}" \
               --ftp-pasv || exit 1

          echo
          echo "✅ Listagem concluída com sucesso."