name: FTP DIRECTORY LIST TEST

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex: 1.4.3)"
        required: true
        default: "1.4.3"
        type: string
      package_name:
        description: "Package (ex: com.lavego.app)"
        required: true
        default: "com.lavego.app"
        type: string

jobs:
  list-directory:
    runs-on: ubuntu-latest

    steps:
      - name: Install curl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl

      - name: List FTP Directory
        run: |
          VERSION="${{ inputs.version }}"
          PACKAGE="${{ inputs.package_name }}"

          REMOTE_PATH="public_html/${VERSION}/${PACKAGE}/apk/"

          echo
          echo "============================================================"
          echo "Conectando ao FTP..."
          echo "Host: ${{ secrets.FTPHOST }}"
          echo "Caminho completo: $REMOTE_PATH"
          echo "============================================================"
          echo

          echo "===== LISTAGEM DA RAIZ ====="
          curl --silent --show-error --fail \
               --user "${{ secrets.FTPUSER }}:${{ secrets.FTPPASS }}" \
               --ftp-pasv \
               "ftp://${{ secrets.FTPHOST }}/" || exit 1

          echo
          echo "===== LISTAGEM DO DIRETÓRIO DESEJADO ====="
          curl --silent --show-error --fail \
               --user "${{ secrets.FTPUSER }}:${{ secrets.FTPPASS }}" \
               --ftp-pasv \
               "ftp://${{ secrets.FTPHOST }}/${REMOTE_PATH}" || exit 1

          echo
          echo "✅ Diretório listado com sucesso."