name: hotfix-671-bump-submodules

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false

      - name: Point gitlinks to #671 master SHAs
        run: |
          set -euo pipefail
          git config user.name "luizkim"
          git config user.email "luizkim@users.noreply.github.com"

          git submodule update --init -- modules/controleonline/ui-logistic modules/controleonline/ui-default modules/controleonline/ui-common

          git -C modules/controleonline/ui-logistic fetch --depth=1 origin 4e2752ee2c10b9002fa7b38d02e0f0f0a6b08a3d
          git -C modules/controleonline/ui-logistic checkout 4e2752ee2c10b9002fa7b38d02e0f0f0a6b08a3d

          git -C modules/controleonline/ui-default fetch --depth=1 origin 404320bfd72162d0a981d75a54763b8171de0503
          git -C modules/controleonline/ui-default checkout 404320bfd72162d0a981d75a54763b8171de0503

          git -C modules/controleonline/ui-common fetch --depth=1 origin b058a244dad4cd5c37e38aab5f9cecc26cbba711
          git -C modules/controleonline/ui-common checkout b058a244dad4cd5c37e38aab5f9cecc26cbba711

          git add modules/controleonline/ui-logistic modules/controleonline/ui-default modules/controleonline/ui-common
          if git diff --cached --quiet; then
            echo "gitlinks already at target SHAs"
            exit 0
          fi
          git commit -m "hotfix(#671): aponta submodulos ui-logistic/ui-default/ui-common"
          git push origin HEAD:master
