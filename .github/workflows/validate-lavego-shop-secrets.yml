name: Validate Lave-Go Shop Secrets

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Android Keystore
        shell: bash
        run: |
          printf '%s' "${{ secrets.LAVEGO_SHOP_KEYSTORE_CERT }}" | base64 -d > /tmp/lave-go.keystore
          keytool -list -keystore /tmp/lave-go.keystore -storepass "${{ secrets.LAVEGO_SHOP_KEYSTORE_PASS }}" -alias lave-go

      - name: Validate Service Account
        shell: bash
        run: |
          printf '%s' "${{ secrets.LAVEGO_SHOP_SERVICE_ACCOUNT }}" | base64 -d > /tmp/service_account.json
          python3 -m json.tool /tmp/service_account.json > /dev/null