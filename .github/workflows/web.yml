# Single web deploy entrypoint. Step 1 configures target; step 2 builds/deploys.
name: Web

on:
  push:
    branches: [staging, master, production]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target key"
        type: choice
        options:
          - staging-manager-ctrl
          - staging-manager-lavego
          - production-manager-ctrl
          - production-shop-ctrl
          - production-admin-ctrl
          - production-app-lavego
        required: true

concurrency:
  group: web-${{ github.event.inputs.target || github.ref_name }}
  cancel-in-progress: false

jobs:
  configure:
    name: "1 · Configure"
    runs-on: ubuntu-latest
    outputs:
      app_type: ${{ steps.set.outputs.app_type }}
      api: ${{ steps.set.outputs.api }}
      socket: ${{ steps.set.outputs.socket }}
      domain: ${{ steps.set.outputs.domain }}
      remote_dir: ${{ steps.set.outputs.remote_dir }}
      ftp_profile: ${{ steps.set.outputs.ftp_profile }}
      should_run: ${{ steps.set.outputs.should_run }}
    steps:
      - id: set
        run: |
          set -e
          # Prefer explicit dispatch target; else map branch to default manager-ctrl
          T="${{ github.event.inputs.target }}"
          if [ -z "$T" ]; then
            case "${{ github.ref_name }}" in
              staging) T=staging-manager-ctrl ;;
              master|production) T=production-manager-ctrl ;;
              *) echo "No default target for branch"; echo "should_run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          fi
          case "$T" in
            staging-manager-ctrl)
              APP=MANAGER; API=https://s.controleonline.com; SOCK=wss://s.controleonline.com
              DOMAIN=; REMOTE='~/public_html'; FTP=staging ;;
            staging-manager-lavego)
              APP=MANAGER; API=https://s.controleonline.com; SOCK=wss://s.controleonline.com
              DOMAIN=; REMOTE='~/public_html'; FTP=staging ;;
            production-manager-ctrl)
              APP=MANAGER; API=https://api.controleonline.com; SOCK=wss://api.controleonline.com
              DOMAIN=; REMOTE='~/public_html'; FTP=production ;;
            production-shop-ctrl)
              APP=SHOP; API=https://api.controleonline.com; SOCK=wss://api.controleonline.com
              DOMAIN=; REMOTE='~/public_html'; FTP=production ;;
            production-admin-ctrl)
              APP=ADMIN; API=https://api.controleonline.com; SOCK=wss://api.controleonline.com
              DOMAIN=; REMOTE='~/public_html'; FTP=production ;;
            production-app-lavego)
              APP=MANAGER; API=https://api.lavego.com; SOCK=wss://api.lavego.com
              DOMAIN=https://app.lavego.com; REMOTE='~/public_html'; FTP=lavego ;;
            *) echo "Unknown target $T"; exit 1 ;;
          esac
          {
            echo "app_type=$APP"
            echo "api=$API"
            echo "socket=$SOCK"
            echo "domain=$DOMAIN"
            echo "remote_dir=$REMOTE"
            echo "ftp_profile=$FTP"
            echo "should_run=true"
          } >> "$GITHUB_OUTPUT"
          echo "Target=$T app=$APP api=$API ftp=$FTP"

  deploy:
    name: "2 · Deploy"
    needs: configure
    if: needs.configure.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Map FTP secrets
        run: |
          set -e
          case "${{ needs.configure.outputs.ftp_profile }}" in
            staging)
              HOST="${{ secrets.STAGING_HOST }}"
              USER="${{ secrets.STAGING_USER }}"
              PASS="${{ secrets.STAGING_PASS }}"
              if [ -z "$HOST" ]; then HOST="${{ secrets.DEV_HOST }}"; USER="${{ secrets.DEV_USER }}"; PASS="${{ secrets.DEV_PASS }}"; fi
              echo "FTP_HOST=$HOST" >> "$GITHUB_ENV"
              echo "FTP_USER=$USER" >> "$GITHUB_ENV"
              echo "FTP_PASS=$PASS" >> "$GITHUB_ENV"
              ;;
            production)
              echo "FTP_HOST=${{ secrets.FTPHOST }}" >> "$GITHUB_ENV"
              echo "FTP_USER=${{ secrets.FTPUSER }}" >> "$GITHUB_ENV"
              echo "FTP_PASS=${{ secrets.FTPPASS }}" >> "$GITHUB_ENV"
              ;;
            lavego)
              echo "FTP_HOST=${{ secrets.FTPHOST }}" >> "$GITHUB_ENV"
              echo "FTP_USER=${{ secrets.FTPUSER }}" >> "$GITHUB_ENV"
              echo "FTP_PASS=${{ secrets.FTPPASS }}" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Export & deploy
        uses: ./.github/actions/web-export-deploy
        with:
          app_type: ${{ needs.configure.outputs.app_type }}
          api_entrypoint: ${{ needs.configure.outputs.api }}
          socket: ${{ needs.configure.outputs.socket }}
          domain: ${{ needs.configure.outputs.domain }}
          remote_dir: ${{ needs.configure.outputs.remote_dir }}
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_APPLICATION_ID: ${{ secrets.NEW_RELIC_APPLICATION_ID }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_TRUST_KEY: ${{ secrets.NEW_RELIC_TRUST_KEY }}
          NEW_RELIC_BEACON: ${{ secrets.NEW_RELIC_BEACON }}
          NEW_RELIC_ERROR_BEACON: ${{ secrets.NEW_RELIC_ERROR_BEACON }}
