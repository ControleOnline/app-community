# Lave-Go whitelabel — único fluxo Android com FTP.
name: Android Lave-Go

on:
  workflow_dispatch:
    inputs:
      target:
        description: production or staging
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve endpoints
        id: cfg
        run: |
          if [ "${{ inputs.target || 'production' }}" = "staging" ]; then
            echo "api=https://s.controleonline.com" >> "$GITHUB_OUTPUT"
            echo "domain=https://staging.controleonline.com" >> "$GITHUB_OUTPUT"
            echo "socket=wss://s.controleonline.com" >> "$GITHUB_OUTPUT"
          else
            echo "api=https://api.lavego.com" >> "$GITHUB_OUTPUT"
            echo "domain=https://app.lavego.com" >> "$GITHUB_OUTPUT"
            echo "socket=wss://api.lavego.com" >> "$GITHUB_OUTPUT"
          fi

      - name: Android build (APK → FTP)
        uses: ./.github/actions/android-build
        with:
          app_type: POS
          display_name: PDV
          package_name: com.lavego.app
          expo_name: Lave-Go
          expo_slug: pos-controle-online
          api_entrypoint: ${{ steps.cfg.outputs.api }}
          domain: ${{ steps.cfg.outputs.domain }}
          manager_app: ${{ steps.cfg.outputs.domain }}
          socket: ${{ steps.cfg.outputs.socket }}
          build_aab: "false"
          build_apk: "true"
          publish_play: "false"
          publish_github: "false"
          publish_ftp: "true"
          bump_version_code_from_package: "true"
        env:
          CERT: ${{ secrets.CERT }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FTPHOST: ${{ secrets.FTPHOST }}
          FTPUSER: ${{ secrets.FTPUSER }}
          FTPPASS: ${{ secrets.FTPPASS }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_APPLICATION_ID: ${{ secrets.NEW_RELIC_APPLICATION_ID }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_TRUST_KEY: ${{ secrets.NEW_RELIC_TRUST_KEY }}
          NEW_RELIC_BEACON: ${{ secrets.NEW_RELIC_BEACON }}
          NEW_RELIC_ERROR_BEACON: ${{ secrets.NEW_RELIC_ERROR_BEACON }}
