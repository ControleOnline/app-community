name: UI Contracts Module Composition Check

on:
  pull_request:
    branches:
      - master
      - staging
    paths:
      - .gitmodules
      - modules/controleonline/ui-contracts
      - .github/workflows/ui-contracts-module-composition-check.yml
      - tools/verify-ui-contracts-module-pointer.cjs

jobs:
  verify-ui-contracts-pointer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Verify ui-contracts module pointer
        run: node tools/verify-ui-contracts-module-pointer.cjs