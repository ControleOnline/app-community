# Trigger Play Store / GitHub release builds for all app_types.
# NAME MUST STAY: "Deploy Android Apps" (Cielo workflows reference this).
name: Deploy Android Apps

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_type: CHECKOUT
            display_name: "Checkout"
            track: internal
            release_status: draft
            changes_not_sent_for_review: true
          - app_type: CRM
            display_name: "CRM"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true
          - app_type: DELIVERY
            display_name: "Delivery"
            track: internal
            release_status: draft
            changes_not_sent_for_review: true
          - app_type: MANAGER
            display_name: "Gestor"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true
          - app_type: MENU
            display_name: "Menu"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true
          - app_type: POS
            display_name: "PDV"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true
          - app_type: PPC
            display_name: "PCP"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true
          - app_type: SERVICE
            display_name: "Service"
            track: internal
            release_status: completed
            changes_not_sent_for_review: true

    uses: ./.github/workflows/android-build.yml
    with:
      app_type: ${{ matrix.app_type }}
      display_name: ${{ matrix.display_name }}
      build_aab: true
      build_apk: true
      publish_play: true
      publish_github: true
      publish_ftp: false
      play_track: ${{ matrix.track }}
      play_status: ${{ matrix.release_status }}
      play_changes_not_sent_for_review: ${{ matrix.changes_not_sent_for_review }}
    secrets:
      CERT: ${{ secrets.CERT }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GMAPS_GOOGLE_CLIENT_ID: ${{ secrets.GMAPS_GOOGLE_CLIENT_ID }}
      NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      NEW_RELIC_APPLICATION_ID: ${{ secrets.NEW_RELIC_APPLICATION_ID }}
      NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
      NEW_RELIC_TRUST_KEY: ${{ secrets.NEW_RELIC_TRUST_KEY }}
      NEW_RELIC_BEACON: ${{ secrets.NEW_RELIC_BEACON }}
      NEW_RELIC_ERROR_BEACON: ${{ secrets.NEW_RELIC_ERROR_BEACON }}
      ANDROID_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}

  # Side-channel deploys after POS / PPC complete (same triggers as before)
  trigger-cielo-and-lg:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Trigger Cielo Deploy PDV / CONTROLE ONLINE
        continue-on-error: true
        run: gh workflow run cielo-deploy-pdv-ctrl.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Cielo Deploy PDV / LAVE-GO
        continue-on-error: true
        run: gh workflow run cielo-deploy-pdv-lavego.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger LG webOS Deploy PPC
        continue-on-error: true
        run: gh workflow run lg-webos-deploy-ppc.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
