# Whitelabel Lave-Go ONLY. Does not run as part of Controle Online deploy.yml.
name: Deploy Lave-Go

on:
  workflow_dispatch:
    inputs:
      target:
        description: "production ou staging endpoints"
        type: choice
        options: [master]
        default: master

permissions:
  contents: write
  actions: write

jobs:
  configure:
    name: "1 · Configure"
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.set.outputs.api }}
      domain: ${{ steps.set.outputs.domain }}
      socket: ${{ steps.set.outputs.socket }}
    steps:
      - id: set
        run: |
            echo "api=https://apinew.lave-go.com" >> "$GITHUB_OUTPUT"
            echo "domain=https://apinew.lave-go.com" >> "$GITHUB_OUTPUT"
            echo "socket=wss://apinew.lave-go.com" >> "$GITHUB_OUTPUT"

  android:
    name: "2 · Android APK"
    needs: configure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/android-build
        with:
          app_type: POS
          display_name: PDV
          package_name: com.lavego.app
          expo_name: Lave-Go
          expo_slug: pos-lave-go
          api_entrypoint: ${{ needs.configure.outputs.api }}
          domain: ${{ needs.configure.outputs.domain }}
          manager_app: ${{ needs.configure.outputs.domain }}
          socket: ${{ needs.configure.outputs.socket }}
          build_aab: "false"
          build_apk: "true"
          publish_play: "false"
          publish_github: "false"
          bump_version_code_from_package: "true"
        env:
          CERT: ${{ secrets.CERT }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_APPLICATION_ID: ${{ secrets.NEW_RELIC_APPLICATION_ID }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_TRUST_KEY: ${{ secrets.NEW_RELIC_TRUST_KEY }}
          NEW_RELIC_BEACON: ${{ secrets.NEW_RELIC_BEACON }}
          NEW_RELIC_ERROR_BEACON: ${{ secrets.NEW_RELIC_ERROR_BEACON }}

      - name: Extract version for FTP path
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=com.lavego.app" >> "$GITHUB_ENV"

      # SamKirkland: basic-ftp (Node), protocol ftp — evita 521 PROT do lftp/locaweb
      - name: Upload APK to Lave-Go FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTPHOST_APPLAVEGO }}
          username: ${{ secrets.FTPUSER_APPLAVEGO }}
          password: ${{ secrets.FTPPASS_APPLAVEGO }}
          protocol: ftp
          security: loose
          local-dir: ./android/app/build/outputs/apk/release/
          server-dir: ./public_html/${{ env.VERSION }}/com.lavego.app/apk/
          state-name: .ftp-deploy-apk-state.json
          log-level: standard

  web:
    name: "2 · Web"
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: FTP env (kept for compatibility)
        run: |
          echo "FTP_HOST=${{ secrets.FTPHOST_APPLAVEGO }}" >> "$GITHUB_ENV"
          echo "FTP_USER=${{ secrets.FTPUSER_APPLAVEGO }}" >> "$GITHUB_ENV"
          echo "FTP_PASS=${{ secrets.FTPPASS_APPLAVEGO }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/web-export-deploy
        with:
          app_type: MANAGER
          api_entrypoint: ${{ needs.configure.outputs.api }}
          socket: ${{ needs.configure.outputs.socket }}
          domain: ${{ needs.configure.outputs.domain }}
          remote_dir: "~/public_html"
          skip_ftp: "true"
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_APPLICATION_ID: ${{ secrets.NEW_RELIC_APPLICATION_ID }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_TRUST_KEY: ${{ secrets.NEW_RELIC_TRUST_KEY }}
          NEW_RELIC_BEACON: ${{ secrets.NEW_RELIC_BEACON }}
          NEW_RELIC_ERROR_BEACON: ${{ secrets.NEW_RELIC_ERROR_BEACON }}

      - name: Deploy web to Lave-Go FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTPHOST_APPLAVEGO }}
          username: ${{ secrets.FTPUSER_APPLAVEGO }}
          password: ${{ secrets.FTPPASS_APPLAVEGO }}
          protocol: ftp
          security: loose
          local-dir: ./dist/
          server-dir: ./public_html/
          state-name: .ftp-deploy-web-state.json
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.ftp-deploy-*.json
