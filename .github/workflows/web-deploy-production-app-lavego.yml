name: Deploy Project app.lave-go.com
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Creating Config
        run: |
          echo "const env = {\
          API_ENTRYPOINT: 'https://apinew.lave-go.com',\
          SOCKET: 'wss://apinew.lave-go.com',\
          APP_TYPE: 'MANAGER',\
          COMPANY_NAME: 'lavego',\
          ZOOM: 0.80,\
          NEW_RELIC:{\
            LICENSE_KEY:'${{ secrets.NEW_RELIC_LICENSE_KEY }}',\
            APPLICATION_ID:'${{ secrets.NEW_RELIC_APPLICATION_ID }}',\
            ACCOUNT_ID: '${{ secrets.NEW_RELIC_ACCOUNT_ID }}',\
            TRUST_KEY: '${{ secrets.NEW_RELIC_TRUST_KEY }}',\
            BEACON: '${{ secrets.NEW_RELIC_BEACON }}',\
            ERROR_BEACON: '${{ secrets.NEW_RELIC_ERROR_BEACON }}'\
          }\
          };\
          module.exports = { env };\
          " > ./config/env.local.js
      - name: Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --recursive --init --checkout
      - name: Install Dependencies
        run: npm install --legacy-peer-deps   
      - name: Fix Expo Dependencies
        run: npx expo install --fix
      - name: Run Automated Tests
        run: |
          rm -rf tests
          mkdir -p tests/automated
          npm test -- --runInBand --json --outputFile=tests/automated/jest-results.json
          printf 'Automated test run completed successfully.\nSee jest-results.json for details.\n' > tests/automated/summary.txt
      - name: Run Browser Smoke Tests
        run: npm run test:browser
      - name: Stage Browser Smoke Results
        run: |
          mkdir -p tests/smoke
          cp -a test-results/. tests/smoke/ 2>/dev/null || true
          printf 'Smoke test run completed successfully.\nScreenshots and other artifacts were copied from test-results/ when available.\n' > tests/smoke/summary.txt
      - name: Build
        run: |
          npx expo export --platform web
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTPHOST_APPLAVEGO }}
          username: ${{ secrets.FTPUSER_APPLAVEGO }}
          password: ${{ secrets.FTPPASS_APPLAVEGO }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
      - name: Deploy Test Results via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTPHOST_APPLAVEGO }}
          username: ${{ secrets.FTPUSER_APPLAVEGO }}
          password: ${{ secrets.FTPPASS_APPLAVEGO }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./tests/
          server-dir: /tests/
          exclude: |
            **/.git*
            **/.git*/**
